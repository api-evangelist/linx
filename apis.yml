aid: linx
name: Linx
description: 'Linx Security is an AI-native identity security and governance platform covering the
  full identity lifecycle across human, non-human, and AI-agent identities. The platform builds an
  Identity Graph that normalizes identity data across SaaS, cloud, and on-prem systems, then layers
  identity security posture management (dormant accounts, admin sprawl, SSO bypass, missing MFA),
  modern IGA (access requests, approvals, provisioning, access certification), just-in-time access
  in place of standing privileges, automated joiner-mover-leaver lifecycle management, and an
  autonomous remediation agent called Autopilot. Linx also ships an MCP Server that exposes the
  Identity Graph and governed identity actions to LLM agents, plus an MCP Gateway for controlling
  AI agent traffic. Founded by Israel Duanis, Niv Goldenberg, and Sarit Reiner Frumkes, the company
  is headquartered in New York and has raised $85M from Cyberstarts, Index Ventures, and Insight
  Partners. Linx does not publish a public developer portal, API reference, or API specification —
  the API referenced in its Master Services Agreement is documented to customers only.'
